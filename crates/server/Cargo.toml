[package]
name = "tierkey-server"
description = "Hands out tierkey level keys to callers that Tailscale grants them to"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
# Deployed from the Dockerfile or the release binaries, not crates.io.
publish = false
rust-version.workspace = true

[dependencies]
axum = "0.8.9"
humantime = "2.4.0"
tierkey-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "signal"] }
toml = "1.2.1"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
