[package]
name = "tierkey"
description = "Encrypted secrets in git with SOPS + age, shared with your team"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["secrets", "sops", "age", "tailscale", "dotenv"]
categories = ["command-line-utilities", "cryptography", "development-tools"]
rust-version.workspace = true

# `cargo binstall tierkey` downloads the release binary for the target, or else builds from source.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/tierkey-{ target }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/tierkey-linux-amd64"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/tierkey-linux-amd64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/tierkey-linux-arm64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/tierkey-linux-arm64"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/tierkey-darwin-amd64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/tierkey-darwin-arm64"

[[bin]]
name = "tierkey"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
hex = "0.4.3"
tierkey-core.workspace = true
rpassword = "7.5.5"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
toml = "1.2.1"
toml_edit = "0.25.19"
# The resolver hook (http.rs) is ureq's unversioned API, which may change in any release.
ureq = "=3.5.1"

[dev-dependencies]
tempfile = "3.27.0"
