# On a v* tag: checks the tag matches the crate version, builds static Linux and macOS binaries
# (amd64 and arm64) for a GitHub release with SHA256SUMS, then publishes tierkey-core and tierkey
# to crates.io and the tierkey + @tierkey/<platform> packages to npm. Consumers pin a version and
# its checksum (scripts/install.sh), or install from npm, where the lockfile pins it.
#
# crates.io: with the CARGO_REGISTRY_TOKEN secret set, it publishes with that token (needed for
# the very first publish). Without it, it uses Trusted Publishing (OIDC), which crates.io must
# have configured for both crates: owner pokedotdev, repository tierkey, workflow release.yml.
#
# npm: Trusted Publishing only, no token. Each of the five packages must exist (npm/bootstrap.sh
# publishes placeholders once) and have a trusted publisher on npmjs.com: repository
# pokedotdev/tierkey, workflow release.yml, `npm publish` allowed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the crate version
        run: |
          want="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_REF_NAME" != "v$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $want in Cargo.toml"
            exit 1
          fi

  build:
    needs: version
    strategy:
      # One platform failing (say, a flaky runner) should not cancel the others' builds.
      fail-fast: false
      matrix:
        include:
          # A fixed image: ubuntu-latest moves to new releases whose package mirrors can lag.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, name: linux-amd64 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, name: linux-arm64 }
          - { target: x86_64-apple-darwin, os: macos-latest, name: darwin-amd64 }
          - { target: aarch64-apple-darwin, os: macos-latest, name: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        # musl-gcc, for the C and assembly in ring (rustls's crypto).
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y musl-tools
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: Build
        run: |
          bins="--bin tierkey"
          case "${{ matrix.target }}" in *linux*) bins="$bins --bin tierkey-server" ;; esac
          cargo build --release --locked --target ${{ matrix.target }} $bins
          mkdir dist
          cp target/${{ matrix.target }}/release/tierkey dist/tierkey-${{ matrix.name }}
          if [ -f target/${{ matrix.target }}/release/tierkey-server ]; then
            cp target/${{ matrix.target }}/release/tierkey-server dist/tierkey-server-${{ matrix.name }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum tierkey-* > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes

  crates:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Trusted Publishing
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - if: env.HAS_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish tierkey-core, then tierkey (the server has publish = false)
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

  npm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted Publishing needs npm 11.5.1 or later and Node 22.14 or later.
      - run: npm install -g npm@11
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: node npm/build.mjs --version "${GITHUB_REF_NAME#v}" --dist dist --out npm-dist --all
      - name: Publish the platform packages, then tierkey
        # npm authenticates through OIDC and adds provenance on its own (public repositories only).
        run: |
          version="${GITHUB_REF_NAME#v}"
          while read -r dir; do
            name="$(node -p "require('./npm-dist/$dir/package.json').name")"
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            (cd "npm-dist/$dir" && npm publish --access public)
          done < npm-dist/order.txt
