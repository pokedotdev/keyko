[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/pokedotdev/tierkey"
rust-version = "1.90"

[workspace.dependencies]
tierkey-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
